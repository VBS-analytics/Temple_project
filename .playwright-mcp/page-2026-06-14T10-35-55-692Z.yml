            - generic [ref=e153]:
              - generic [ref=e154]:
                - paragraph [ref=e155]: Shri Shri Kanchi Mahaperiyava graced the village twice — an honour even once would be rare — and Shri Shri Ramana Maharishi offered his blessings through a sevaka from our Pannai family who served since childhood before spending his final years back in the agraharam.
                - paragraph [ref=e156]: The village has produced leaders recognised by the government with top honours, and our family tree stretches three to four generations above and below us, tying us together as a lineage with shared stories and responsibilities.
