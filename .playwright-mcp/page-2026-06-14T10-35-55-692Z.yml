              - generic [ref=e139]:
                - paragraph [ref=e140]: The western edge of the agraharam features the Lakshmi Narayanar Perumal Koil, anchored by a striking gopuram and aligned between two rows of houses so residents can witness deeparadhana from their doorsteps.
                - paragraph [ref=e141]: Inside the temple, Pambu Puttru (the snake hole) in the southwest corner still shelters snakes that villagers feed with milk, while a pond named Ayyan Kulam sits just northwest of the shrine.
                - paragraph [ref=e142]: On the eastern end stands the Gnanambika Samedha Kalahastiswarar Koil with the Poorna Pushkala Samedha Ayyanar Koil opposite. A short walk east reveals the well-maintained Mazhai Marriamman Koil, and about 1 km further on the village edge is the Damodara Pillayar Koil established by the Pannai family.
          - generic [ref=e143]:
