            - generic [ref=e77]: SIGNIFICANCE OF KAKKALANI VILLAGE
            - heading "A Resilient Heritage of Faith, Rivers & Temples" [level=2] [ref=e78]:
              - text: A Resilient Heritage of
              - emphasis [ref=e79]: Faith, Rivers & Temples
            - paragraph [ref=e80]: Kakkalani Agraharam has grown around sacred shrines, ancestral homes, and nourishing water — every pond, temple, and tree carries its own story of guardianship and service from the families that still call this village home.
          - generic [ref=e87]:
            - generic [ref=e88]:
              - img [ref=e90]
              - heading "History & Foundations" [level=3] [ref=e93]
            - generic [ref=e95]:
              - generic [ref=e96]:
                - paragraph [ref=e97]: Kakkalani is a beautiful village located 10 km southeast of Thiruvarur, a town famous for the Thyagaraja Swamy temple that houses a Maragadam Shiva Lingam believed to have once been worshipped by Lord Indiran.
                - paragraph [ref=e98]: According to earlier generations, the Chozha king consecrated 48 Shiva temples around Thyagaraja Swamy temple during the mandalam period, and Kakkalani is home to one of those temples — Gnanambal Sametha Kalahastiswarar. Prior to our forefathers moving in four to five generations ago, Rayar families were said to have settled here.
                - paragraph [ref=e99]: Kakkalani Agraharam was laid out with the Kadugayar river (a branch of the Kaveri) running along the northern edge. On the riverbank, the Pillayar under the Peepal tree was later relocated into the Aathagarai Pillayar Koil inside the temple compound.
              - generic [ref=e100]:
                - generic [ref=e101]:
                  - img [ref=e103]
                  - generic [ref=e105]: Village Snapshot
                - paragraph [ref=e106]: Kadugayar river, gopurams, snake holes, and community ponds are woven into day-to-day life. The village invites you to witness the temples, participate in upkeep, and carry the legacy forward.
